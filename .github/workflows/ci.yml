name: Immune Staff CI Build Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-backend:
    name: Backend GAS TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Build Backend (Bundle Google Apps Script)
        run: |
          cd backend
          npm run build

      - name: Verify Code.js Output
        run: |
          test -f backend/src/Code.js
          test -f Code.js
          echo "Backend GAS build verified successfully!"

  build-frontend:
    name: Frontend React Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend (TypeScript + Vite)
        run: |
          cd frontend
          npm run build

      - name: Verify Frontend Dist Output
        run: |
          test -d frontend/dist
          echo "Frontend React build verified successfully!"
